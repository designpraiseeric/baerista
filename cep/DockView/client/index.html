<!DOCTYPE html>
<html data-theme="night">
<head>
  <meta charset="UTF-8" />
  <title>DockView</title>
  <link rel="stylesheet" href="../dp/dp-brand.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="app">

    <div id="toolbar">
      <button id="btn-saved" class="icon-btn" title="Saved links">&#9776;</button>
      <button id="btn-back" class="icon-btn" title="Back">&#8592;</button>
      <button id="btn-fwd" class="icon-btn" title="Forward">&#8594;</button>
      <button id="btn-reload" class="icon-btn" title="Reload">&#8635;</button>
      <input id="address" type="text" placeholder="Drop a link, or type a URL and press Enter" />
      <button id="btn-star" class="icon-btn" title="Save this page">&#9734;</button>
      <button id="btn-fit" class="icon-btn active" title="Fit page width to the panel">&#8862;</button>
      <button id="btn-split" class="icon-btn" title="Split view (Shift-click a tab to send it right)">&#9636;</button>
      <button id="btn-external" class="icon-btn" title="Open in your browser">&#8599;</button>
      <button id="btn-signin" class="icon-btn" title="Sign in (opens a separate sign-in window)">&#128100;</button>
      <button id="btn-new" class="icon-btn" title="New tab">+</button>
    </div>

    <div id="tabbar"></div>

    <div id="content">
      <aside id="saved">
        <div id="saved-head">
          <span>Saved</span>
          <button id="btn-add-link" class="icon-btn" title="Add a link">+</button>
        </div>
        <div id="saved-list"></div>
      </aside>
      <div id="pane-a" class="pane active"></div>
      <div id="pane-b" class="pane"></div>
      <div id="dropzone">
        <div id="dropzone-inner">
          <div id="dropzone-label">Drop a link to open it here</div>
        </div>
      </div>
      <div id="empty-state">
        <p>Drag a link in, or paste a URL above and press Enter.</p>
        <p class="hint">Tabs stay loaded in the background. Save pages with &#9734; and find them under &#9776;.</p>
      </div>
    </div>

    <div class="dp-foot" data-id="dockview" data-name="DockView" data-version="2.0.0"></div>
  </div>

  <script src="lib/CSInterface.js"></script>
  <script src="../dp/dp-brand.js"></script>
  <script src="main.js"></script>
</body>
</html>
